name: Build & release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build packages for Firefox, Chrome, Edge and Opera
        run: scripts/build.sh "${GITHUB_REF_NAME}"

      - name: Lint Firefox package
        run: npx --yes web-ext lint --source-dir build/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  # The store jobs only run for tags and are skipped silently while the
  # matching secrets are not configured (see README, "Releasing").
  publish-firefox:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Firefox directory
        if: env.AMO_JWT_ISSUER != ''
        run: scripts/build.sh "${GITHUB_REF_NAME}"
      - name: Submit to addons.mozilla.org (listed)
        if: env.AMO_JWT_ISSUER != ''
        run: >
          npx --yes web-ext sign
          --source-dir build/firefox
          --channel listed
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"
          --approval-timeout 0

  publish-chrome:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.CWS_EXTENSION_ID != ''
        with:
          name: packages
          path: dist
      - name: Upload to Chrome Web Store and submit for review
        if: env.CWS_EXTENSION_ID != ''
        run: >
          npx --yes chrome-webstore-upload-cli@3 upload --auto-publish
          --source dist/keyword-filter-chrome-${GITHUB_REF_NAME#v}.zip
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

  publish-edge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.EDGE_PRODUCT_ID != ''
        with:
          name: packages
          path: dist
      - name: Upload to Microsoft Edge Add-ons and submit for review
        if: env.EDGE_PRODUCT_ID != ''
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: dist/keyword-filter-edge-${{ github.ref_name }}.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
