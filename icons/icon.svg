      <stop offset="1" stop-color="#F3E8FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3B0764" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
